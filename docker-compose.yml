services:

  # ---------------------------------------------------------------
  # Suite control database
  # Hosts: nene_suite (control) + one database per installed app
  # Local port: 3390 (see CLAUDE.md — portfolio port registry)
  # ---------------------------------------------------------------
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${NENE_SUITE_PROVISION_DB_PASSWORD:?NENE_SUITE_PROVISION_DB_PASSWORD is required}
      MYSQL_DATABASE: nene_suite
      MYSQL_USER: nene_suite
      MYSQL_PASSWORD: ${NENE_SUITE_CONTROL_DB_PASSWORD:?NENE_SUITE_CONTROL_DB_PASSWORD is required}
    ports:
      - "${SUITE_DB_PORT:-3390}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "-p${NENE_SUITE_PROVISION_DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # ---------------------------------------------------------------
  # NeNe Suite apex shell (login + app launcher + installer)
  # Local port: 8800 (see CLAUDE.md — portfolio port registry)
  # ---------------------------------------------------------------
  suite:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.suite
    environment:
      # Control DB connection (resolved by ControlDatabaseConfigResolver — ADR 0011)
      NENE_SUITE_CONTROL_DATABASE_URL: >-
        mysql://nene_suite:${NENE_SUITE_CONTROL_DB_PASSWORD}@db:3306/nene_suite
      # Provisioning DB credentials (privileged — installer only)
      NENE_SUITE_PROVISION_DB_HOST: db
      NENE_SUITE_PROVISION_DB_PORT: "3306"
      NENE_SUITE_PROVISION_DB_USER: root
      NENE_SUITE_PROVISION_DB_PASSWORD: ${NENE_SUITE_PROVISION_DB_PASSWORD}
    ports:
      - "${SUITE_HTTP_PORT:-8800}:80"
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Sibling app services
  # Uncomment and adjust paths after cloning sibling repos alongside
  # this directory (e.g. ../nene-invoice, ../nene-clear).
  # Each sibling must support NENE_SUITE_MODE=1 env readers.
  # See docs/integrations/sibling-products.md
  # ---------------------------------------------------------------

  # nene-invoice:
  #   build: ../nene-invoice
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file: ../nene-invoice/.env
  #   environment:
  #     NENE_SUITE_MODE: "1"
  #     NENE_SUITE_ID: ${NENE_SUITE_ID}
  #     NENE_SUITE_ORG_EXTERNAL_ID: ${NENE_SUITE_ORG_EXTERNAL_ID}
  #     NENE_SUITE_JWT_SECRET: ${NENE_SUITE_JWT_SECRET}
  #     NENE_SUITE_APEX_URL: ${NENE_SUITE_APEX_URL}
  #   ports:
  #     - "8500:80"   # NeNe Invoice local port (see CLAUDE.md)
  #   restart: unless-stopped

  # nene-clear:
  #   build: ../nene-clear
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     nene-invoice:
  #       condition: service_started
  #   env_file: ../nene-clear/.env
  #   environment:
  #     NENE_SUITE_MODE: "1"
  #     NENE_SUITE_ID: ${NENE_SUITE_ID}
  #     NENE_SUITE_ORG_EXTERNAL_ID: ${NENE_SUITE_ORG_EXTERNAL_ID}
  #     NENE_SUITE_JWT_SECRET: ${NENE_SUITE_JWT_SECRET}
  #     NENE_SUITE_APP_NENE_INVOICE_URL: ${NENE_SUITE_APP_NENE_INVOICE_URL}
  #   ports:

# Auto-deploy to staging (ConoHa VPS) after CI succeeds on a `main` push.
# Pull-based: this workflow only SSHes in and runs the VPS deploy script, which
# does the git pull + rebuild + health check. See docs/ops/staging-deploy.md.
name: Deploy (staging)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    # Only for a successful CI run triggered by a push to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Run deploy script over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          script_stop: true
          script: bash /home/deploy/envs/suite-stg/nene-suite/deploy-staging.sh

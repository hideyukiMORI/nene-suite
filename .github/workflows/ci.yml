# CI — runs the same self-contained guards used locally, on every PR and main push.
# No CI-only validation logic: each step mirrors a documented local command.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-contract:
    name: Docs, catalog & OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Terminology guard
        run: bash tools/check-terminology.sh

      - name: Docs relative-link check
        run: bash tools/check-links.sh

      - name: Catalog validation (schema + DAG)
        run: bash tools/validate-catalog.sh

      - name: OpenAPI contract lint
        run: npx --yes @redocly/cli@2 lint docs/openapi/openapi.yaml

  frontend:
    name: Frontend (type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OpenAPI codegen freshness check
        run: |
          npm run codegen
          git diff --exit-code src/shared/api/schema.gen.ts || \
            (echo "ERROR: schema.gen.ts is stale — run 'npm run codegen' and commit." && exit 1)

      - name: Type-check and test
        run: npm run check

      # audit-ci = npm audit + a per-advisory allowlist, so a not-yet-fixable advisory can be
      # excepted with a written, expiring reason instead of blunting the whole gate. Anything
      # high/critical that is not listed in frontend/audit-ci.jsonc still fails.
      # Policy: docs/development/dependency-audit.md
      - name: Audit (fail on high/critical)
        run: npm run audit

  backend:
    name: Backend (PHPUnit + PHPStan + CS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Clone NENE2 (local path dependency)
        run: git clone --depth=1 https://github.com/hideyukiMORI/NENE2.git ../NENE2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run checks
        run: composer check

      - name: OpenAPI contract validation (PHP)
        run: composer openapi

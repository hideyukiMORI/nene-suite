# CI — runs the same self-contained guards used locally, on every PR and main push.
# No CI-only validation logic: each step mirrors a documented local command.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-contract:
    name: Docs, catalog & OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Terminology guard
        run: bash tools/check-terminology.sh

      - name: Catalog validation (schema + DAG)
        run: bash tools/validate-catalog.sh

      - name: OpenAPI contract lint
        run: npx --yes @redocly/cli@2 lint docs/openapi/openapi.yaml

  frontend:
    name: Frontend (type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: npm run check

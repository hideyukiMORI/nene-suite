  /api/v1/auth/session:
    post:
      tags: [Auth]
      operationId: createAuthSession
      summary: Log in — create an apex operator session.
      description: |
        Authenticates an operator by email and password and returns a short-lived
        apex JWT plus the operator profile. Unauthenticated. Invalid credentials
        return 401 `invalid-credentials` (not 422) so the apex shell can show a
        single "invalid email or password" message without revealing which field failed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthSessionRequest'
            example:
              email: operator@example.com
              password: '••••••••'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
                expiresAt: '2026-05-30T11:48:46Z'
                operator:
                  id: 01J8XR0G7Q9V2H7K3N5M0B8TCA
                  email: operator@example.com
                  displayName: Example Operator
        '401':
          description: Invalid email or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://nene-suite.dev/problems/invalid-credentials
                title: Invalid credentials
                status: 401
                detail: Invalid email or password.
                instance: /api/v1/auth/session
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Auth]
      operationId: getAuthSession
      summary: Current operator for the presented token.
      description: |
        Returns the operator associated with the bearer token, so the apex shell
        can validate the session on load and render the signed-in operator.
        Read-only; no audit event.
      responses:
        '200':
          description: Authenticated operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionContext'
              example:
                id: 01J8XR0G7Q9V2H7K3N5M0B8TCA
                email: operator@example.com
                displayName: Example Operator
                orgExternalId: 01J8XR0G7Q9V2H7K3N5M0B8ORG
                role: admin
                superadmin: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Auth]
      operationId: deleteAuthSession
      summary: Log out — end the apex operator session.
      description: |
        Ends the current session and denylists the presented token's `jti` so the
        stateless JWT can no longer authenticate until it expires; clients should still
        discard the token. A pre-revocation token without a `jti` has nothing to denylist
        and still returns 204.
      responses:
        '204':
          description: Session ended; no content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/session/organizations:
    get:
      tags: [Auth]
      operationId: listSessionOrganizations
      summary: List the current operator's organizations.
      description: |
        Returns the organizations the bearer-token operator belongs to (oldest first),
        each with the operator's role, to drive the active-organization switcher.
        Operator self-service. Read-only; no audit event.
      responses:
        '200':
          description: The operator's organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOrganizationList'
              example:
                organizations:
                  - organizationId: 01J8XR0G7Q9V2H7K3N5M0B8TCA
                    externalId: 01J8XRDEXT0000000000000ZAB
                    name: Acme KK
                    slug: acme-kk
                    role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/session/active-organization:
    put:
      tags: [Auth]
      operationId: switchActiveOrganization
      summary: Switch the session's active organization.
      description: |
        Re-scopes the operator's session to an organization they belong to and returns a
        fresh apex JWT carrying that organization's context. Operator self-service. An
        unknown organization, or one the operator is not a member of, returns 404 — the
        existence of organizations is not revealed to non-members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchActiveOrganizationRequest'
            example:
              organizationId: 01J8XR0G7Q9V2H7K3N5M0B8TCA
      responses:
        '200':
          description: Active organization switched; a new session is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
                expiresAt: '2026-05-30T11:48:46Z'
                operator:
                  id: 01J8XR0G7Q9V2H7K3N5M0B8TCA
                  email: operator@example.com
                  displayName: Example Operator
                orgExternalId: 01J8XRDEXT0000000000000ZAB
                role: admin
                superadmin: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getFederationJwks
      summary: Federation signing key set (JWKS).
      description: |
        Published JSON Web Key Set of the suite's federation signing **public** keys (active +
        retiring), so sibling apps can verify ES256 assertions and refresh on an unknown `kid`
        (ADR 0012 §3). Public key material only; unauthenticated and cacheable. **Hosted edition
        only** — absent (404) in a self-hosted install. Like `/health`, this non-`/api/v1` path is
        documented but intentionally excluded from the served-route contract test.
      security: []
      responses:
        '200':
          description: The federation JWKS.
          headers:
            Cache-Control:
              description: Public cache directive (short max-age).
              schema:
                type: string
            ETag:
              description: Strong validator over the published key set.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'
              example:
                keys:
                  - kty: EC
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                    use: sig
                    alg: ES256
                    kid: NzbLsXh8uDCcd-6MNwXF4W_7noWXFZAfHkxZsRGC9Xs
        '404':
          description: Not served — the hosted federation surface is disabled (self-hosted edition).
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Apex operator JWT (suite mode issuer, `docs/explanation/suite-environment-contract.md`).
        Required for authenticated apex endpoints. Installer wizard steps run
        pre-auth on the host during setup, so they are unauthenticated and record
        `actor_user_id: null` with an `actor_label` fallback (audit-trail §3).

  parameters:
    InstallSessionId:
      name: installSessionId
      in: path
      required: true
      description: ULID of the install session (maps to `install_session_id`).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01J8XR4ZS6Q9V2H7K3N5M0B8TC
    OriginFeedLocale:
      name: locale
      in: query
      required: false
      description: Render locale. Suite renders en | ja (default en); other values degrade to en, and a missing locale variant falls back to en.
      schema:
        type: string
        enum: [en, ja]
      example: ja

  responses:
    Unauthorized:
      description: Authentication required or token invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/unauthorized
            title: Authentication required
            status: 401
            detail: A valid apex operator token is required.
            instance: /api/v1/installed-apps
    InstallSessionNotFound:
      description: No install session with that id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/install-session-not-found
            title: Install session not found
            status: 404
            detail: 'No install session exists for id 01J8XR4ZS6Q9V2H7K3N5M0B8TC.'
            instance: /api/v1/install-sessions/01J8XR4ZS6Q9V2H7K3N5M0B8TC
    InstallSessionConflict:
      description: Session is in a state that does not allow this transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/install-session-conflict
            title: Install session conflict
            status: 409
            detail: This install session is already completed and cannot be modified.
            instance: /api/v1/install-sessions/01J8XR4ZS6Q9V2H7K3N5M0B8TC/complete
    ValidationFailed:
      description: Request body or parameters failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://nene-suite.dev/problems/validation-failed
            title: Validation failed
            status: 422
            detail: One or more fields are invalid.
            instance: /api/v1/install-sessions
            errors:
              - field: tier
                code: invalid_enum
                detail: 'tier must be one of: B'
    TooManyRequests:
      description: Rate limit exceeded for this public endpoint.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (sent on login rate-limit responses).
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Rate limit exceeded. Please retry later.
            instance: /health
    ServerError:
      description: Unexpected server error. No stack traces, SQL, paths, or secrets exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/internal-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred. Please try again later.
            instance: /api/v1/install-sessions
    Forbidden:
      description: Authenticated, but the operator lacks platform superadmin privileges.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/forbidden
            title: Forbidden
            status: 403
            detail: Platform superadmin privileges are required.
            instance: /api/v1/organizations
    OrganizationSlugConflict:
      description: An organization with the requested slug already exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/organization-slug-conflict
            title: Organization slug already exists
            status: 409
            detail: An organization with this slug already exists.
            instance: /api/v1/organizations
    OrganizationNotFound:
      description: No organization with that id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/organization-not-found
            title: Organization not found
            status: 404
            detail: No organization exists for the requested id.
            instance: /api/v1/organizations/01J8XR0G7Q9V2H7K3N5M0B8TCA
    MembershipConflict:
      description: The operator already has a membership in this scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/membership-conflict
            title: Membership already exists
            status: 409
            detail: The operator already has a membership in this scope.
            instance: /api/v1/organizations/01J8XR4ZS6Q9V2H7K3N5M0B8TC/memberships
    MembershipInvariant:
      description: The change would violate a membership invariant (e.g. removing the last admin).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/membership-invariant
            title: Membership invariant violated
            status: 409
            detail: The last administrator of an organization cannot be removed.
            instance: /api/v1/memberships/01J8XRMEM00000000000000ZAB
    MembershipNotFound:
      description: No membership with that id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://nene-suite.dev/problems/membership-not-found
            title: Membership not found
            status: 404
            detail: No membership exists for the requested id.
            instance: /api/v1/memberships/01J8XRMEM00000000000000ZAB

  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: Crockford base32 ULID (26 chars). Matches `schema/*.schema.json`.
      example: 01J8XR4ZS6Q9V2H7K3N5M0B8TC

    Organization:
      type: object
      additionalProperties: false
      required: [id, externalId, name, slug, status]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        externalId:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        status:
          type: string
          enum: [active, disabled]

    OrganizationList:
      type: object
      additionalProperties: false
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

    RenameOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200

    RoleEnum:
      type: string
      enum: [admin, member, viewer]
      description: Organization-scoped role. The platform `superadmin` role is not grantable via this API.

    Membership:
      type: object
      additionalProperties: false
      required: [id, operatorId, organizationId, role]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        operatorId:
          $ref: '#/components/schemas/Ulid'
        organizationId:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The organization, or null for a platform superadmin membership.
        role:
          type: string
          enum: [superadmin, admin, member, viewer]

    OrganizationMember:
      type: object
      additionalProperties: false
      required: [membershipId, operatorId, email, displayName, role]
      properties:
        membershipId:
          $ref: '#/components/schemas/Ulid'
        operatorId:
          $ref: '#/components/schemas/Ulid'
        email:
          type: [string, 'null']
          format: email
        displayName:
          type: [string, 'null']
          maxLength: 320
        role:
          type: string
          enum: [admin, member, viewer]

    OrganizationMemberList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'

    GrantMembershipRequest:
      type: object
      additionalProperties: false
      required: [operatorId, role]
      properties:
        operatorId:
          $ref: '#/components/schemas/Ulid'
        role:
          $ref: '#/components/schemas/RoleEnum'

    ChangeMembershipRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'

    CatalogId:
      type: string
      pattern: '^nene-[a-z0-9-]+$'
      description: Catalog app id (`docs/explanation/terminology.md` §2.1).
      example: nene-invoice

    Operator:
      type: object
      additionalProperties: false
      required: [id, email]
      description: Apex operator identity. No password or secret material.
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        email:
          type: string
          format: email
        displayName:
          type: [string, 'null']
          maxLength: 320

    OperatorList:
      type: object
      additionalProperties: false
      required: [operators]
      properties:
        operators:
          type: array
          items:
            $ref: '#/components/schemas/Operator'

    SessionOrganization:
      type: object
      additionalProperties: false
      required: [organizationId, externalId, name, slug, role]
      description: An organization the current operator belongs to, with their role in it.
      properties:
        organizationId:
          $ref: '#/components/schemas/Ulid'
        externalId:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        role:
          $ref: '#/components/schemas/RoleEnum'

    SessionOrganizationList:
      type: object
      additionalProperties: false
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/SessionOrganization'

    SwitchActiveOrganizationRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          $ref: '#/components/schemas/Ulid'

    CreateOperatorRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          description: Minimum 12 characters. Never echoed or stored in plaintext.
          minLength: 12
        displayName:
          type: [string, "null"]
          maxLength: 320
    CreateAuthSessionRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Never logged, stored in plaintext, or echoed in audit/manifest.

    AuthSession:
      type: object
      additionalProperties: false
      required: [token, expiresAt, operator]
      properties:
        token:
          type: string
          description: 'Apex operator JWT (bearer). Present it as the Authorization: Bearer header.'
        expiresAt:
          type: string
          format: date-time
        operator:
          $ref: '#/components/schemas/Operator'
        orgExternalId:
          type: [string, 'null']
          description: Active organization's federation key (null if the session has no active org).
        role:
          type: [string, 'null']
          enum: [admin, member, viewer, null]
          description: The operator's role in the active organization (null if none). `superadmin` is the separate platform dimension below.
        superadmin:
          type: boolean
          description: Whether the operator is a platform superadmin (cross-organization).

    AuthSessionContext:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        email:
          type: string
          format: email
        displayName:
          type: [string, 'null']
          maxLength: 320
        orgExternalId:
          type: [string, 'null']
          description: Active organization's federation key (null if the session has no active org).
        role:
          type: [string, 'null']
          enum: [admin, member, viewer, null]
          description: The operator's role in the active organization (null if none).
        superadmin:
          type: boolean
          description: Whether the operator is a platform superadmin (cross-organization).

    Jwk:
      type: object
      description: A public JSON Web Key (EC; RFC 7517 / 7518). Public material only — no private `d`.
      required: [kty, crv, x, y, use, alg, kid]
      properties:
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        x:
          type: string
          description: base64url X coordinate (fixed 32-byte field size).
        y:
          type: string
          description: base64url Y coordinate (fixed 32-byte field size).
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [ES256]
        kid:
          type: string
          description: RFC 7638 JWK thumbprint.

    JwkSet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, suiteMode, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        suiteMode:
          type: boolean
          description: Reflects `NENE_SUITE_MODE` (ADR 0004).
        time:
          type: string
          format: date-time

    CatalogApp:
      type: object
      additionalProperties: false
      required: [id, name, status, requires, provides]
      description: One catalog entry (mirrors `catalog/apps.json`; `installEntry` ↔ `install_entry`).
      properties:
        id:
          $ref: '#/components/schemas/CatalogId'
        name:
          type: string
          description: Display name (terminology §1, exact spelling, e.g. "NeNe Invoice").
        repository:
          type: [string, 'null']
          description: '`owner/repo` or null for unannounced apps.'
        path:
          type: string
        status:
          type: string
          enum: [planned, installable, deprecated]
        requires:
          type: array
          items:
            $ref: '#/components/schemas/CatalogId'
        provides:
          type: array
          items:
            type: string
          description: Capability tokens (terminology §2.3), e.g. `billing-api`.
        installEntry:
          type: string
          description: Sibling installer entry path (`install_entry` in catalog JSON).
        databaseEnvPrefix:
          type: string
          description: Per-app DB env prefix (`database.env_prefix` in catalog JSON).
          example: NENE_INVOICE_DB_

    CatalogAppList:
      type: object
      additionalProperties: false
      required: [version, apps]
      properties:
        version:
          type: integer
          minimum: 1
        apps:
          type: array
          items:
            $ref: '#/components/schemas/CatalogApp'

    InstallSessionStatus:
      type: string
      enum: [in_progress, completed, failed]
      description: Lifecycle state (PHP `InstallSessionStatus`; HTTP value is snake_case).

    Tier:
      type: string
      enum: [B]
      description: |
        Deployment tier (terminology §11). Phase 1 ships **Tier B** (Docker / VPS)
        only; **Tier A** (shared hosting) follows in Phase 3 and will extend this enum.

    InstallSession:
      type: object
      additionalProperties: false
      required:
        - id
        - suiteId
        - status
        - tier
        - catalogRevision
        - selectedApps
        - disclaimerAccepted
        - createdAt
        - updatedAt
      description: Installer wizard run. Persisted in the `nene_suite` control DB (no secrets).
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        suiteId:
          allOf:
            - $ref: '#/components/schemas/Ulid'
          description: Matches `NENE_SUITE_ID` / manifest `suite_id`.
        status:
          $ref: '#/components/schemas/InstallSessionStatus'
        tier:
          $ref: '#/components/schemas/Tier'
        catalogRevision:
          type: integer
          minimum: 1
          description: Pinned `catalog/apps.json` `version` at session start.
        selectedApps:
          type: array
          description: Catalog ids selected, dependency-resolved and ordered.
          items:
            $ref: '#/components/schemas/CatalogId'
        disclaimerAccepted:
          type: boolean
        disclaimerAcceptedAt:
          type: [string, 'null']
          format: date-time
        orgExternalId:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: Federation UUID (`org_external_id`) — IT federation only, not tax registration.
        orgDisplayName:
          type: [string, 'null']
          maxLength: 500
        installManifestId:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: Set when `status` is `completed`; links to the written install manifest.
        failureCode:
          type: [string, 'null']
          description: Set when `status` is `failed`; mirrors audit `metadata_json.failure_code`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time

    StartInstallSessionRequest:
      type: object
      additionalProperties: false
      required: [tier]
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        selectedApps:
          type: array
          description: Optional initial selection; can also be set later via `updateAppSelection`.
          items:
            $ref: '#/components/schemas/CatalogId'
        orgDisplayName:
          type: string
          maxLength: 500

    UpdateAppSelectionRequest:
      type: object
      additionalProperties: false
      required: [selectedApps]
      properties:
        selectedApps:
          type: array
          description: |
            Catalog ids the operator wants. The server resolves dependencies
            (adds required apps) and rejects non-`installable` entries.
          items:
            $ref: '#/components/schemas/CatalogId'

    AcceptDisclaimerRequest:
      type: object
      additionalProperties: false
      required: [disclaimerVersion]
      properties:
        disclaimerVersion:
          type: string
          description: Version string of the accepted disclaimer copy.
          maxLength: 64
          example: '2026-05-29'
        acceptedLabel:
          type: string
          description: Operator display label (e.g. email) stored as audit `actor_label`. No secrets.
          maxLength: 320

    FailInstallSessionRequest:
      type: object
      additionalProperties: false
      required: [failureCode]
      properties:
        failureCode:
          type: string
          description: Machine code persisted to audit `metadata_json.failure_code`.
          pattern: '^[a-z0-9_]+$'
          maxLength: 64
          example: database_provision_failed
        reason:
          type: string
          description: Human-readable detail (no secrets).
          maxLength: 1000

    SsotRole:
      type: string
      enum: [billing, reconciliation_evidence, cms, archive, none]
      description: |
        System-of-record role for the launcher label (terminology §7), derived from
        catalog `provides`: `billing-api`→`billing`, `reconciliation-api`→
        `reconciliation_evidence`, `cms-api`→`cms`, `archive-api`→`archive`.

    InstalledApp:
      type: object
      additionalProperties: false
      required: [catalogId, name, publicUrl, ssotRole]
      properties:
        catalogId:
          $ref: '#/components/schemas/CatalogId'
        name:
          type: string
        publicUrl:
          type: string
          format: uri
          description: Public base URL (manifest `public_url`).
        databaseName:
          type: [string, 'null']
          maxLength: 64
          description: Per-app database name (manifest `database_name`). No credentials.
        ssotRole:
          $ref: '#/components/schemas/SsotRole'

    InstalledAppList:
      type: object
      additionalProperties: false
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/InstalledApp'

    OriginUpdate:
      type: object
      additionalProperties: false
      required: [product, channel, installedVersion, status, latestVersion, minSupportedVersion, changelogUrl, releasedAt, freshness, reason, warnings]
      properties:
        product:
          type: string
        channel:
          type: string
        installedVersion:
          type: [string, 'null']
          description: Currently installed version, or null when Suite does not track it yet.
        status:
          type: string
          enum: [up_to_date, update_available, forced, unknown, unavailable]
        latestVersion:
          type: [string, 'null']
          description: Verified latest version from the Origin manifest.
        minSupportedVersion:
          type: [string, 'null']
          description: Security floor; an installed version below this is a forced update.
        changelogUrl:
          type: [string, 'null']
          format: uri
        releasedAt:
          type: [string, 'null']
          format: date-time
        freshness:
          type: [string, 'null']
          enum: [fresh, warn, refuse_new, hard, null]
          description: Per-tree freshness state of the verified current pointer.
        reason:
          type: [string, 'null']
          description: Stable verification reason when status is unavailable (or origin_unreachable).
        warnings:
          type: array
          items:
            type: string

    OriginUpdateList:
      type: object
      additionalProperties: false
      required: [available, updates]
      properties:
        available:
          type: boolean
          description: False when Origin is not configured (no URL or trust anchor); updates is then empty.
        updates:
          type: array
          items:
            $ref: '#/components/schemas/OriginUpdate'

    OriginFeed:
      type: object
      additionalProperties: false
      required: [product, audience, kind, requestedLocale, servedLocale, available, count, items, freshness, reason, warnings]
      properties:
        product:
          type: string
        audience:
          type: string
          description: Cohort the feed was fetched for (free until org-tier tracking lands).
        kind:
          type: string
          enum: [announcement, ad]
        requestedLocale:
          type: string
        servedLocale:
          type: string
          description: Locale actually returned (may differ from requested after the en fallback).
        available:
          type: boolean
        count:
          type: integer
          description: Signed item count; 0 is a published-empty feed (available, no items).
        items:
          type: array
          description: Verified feed body — announcement / ad objects passed through as-is.
          items:
            type: object
            additionalProperties: true
        freshness:
          type: [string, 'null']
          enum: [fresh, warn, refuse_new, hard, null]
        reason:
          type: [string, 'null']
          description: Stable verification reason when the feed is unavailable (or origin_unreachable).
        warnings:
          type: array
          items:
            type: string

    OriginFeedList:
      type: object
      additionalProperties: false
      required: [available, feeds]
      properties:
        available:
          type: boolean
          description: False when Origin is not configured (no URL or trust anchor); feeds is then empty.
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/OriginFeed'

    AuditEntityType:
      type: string
      description: Affected orchestration entity (audit-trail §4; matches `schema/suite-audit-event.schema.json`).
      enum:
        - install_session
        - app_selection
        - disclaimer_acknowledgment
        - suite_env_config
        - app_database
        - integration_wiring
        - install_manifest
        - suite_org_profile
        - catalog_pin
        - apex_operator
        - organization
        - membership
        - federation_signing_key

    AuditSource:
      type: string
      enum: [installer_ui, installer_cli, apex_admin, system, api]

    SuiteAuditEvent:
      type: object
      additionalProperties: false
      description: |
        Read projection of one append-only audit row. snake_case persistence
        columns are mapped to camelCase here: `before`→`before_json`,
        `after`→`after_json`, `metadata`→`metadata_json`, `*Id`→`*_id`.
        Sanitized — secret-bearing values already appear as `"[REDACTED]"`
        (audit-trail §5).
      required: [id, suiteId, action, entityType, entityId, createdAt, source]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        suiteId:
          $ref: '#/components/schemas/Ulid'
        orgExternalId:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        actorUserId:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: Apex user; null for pre-auth wizard / system events.
        actorLabel:
          type: [string, 'null']
          maxLength: 320
          description: Display fallback only; no secrets.
        action:
          type: string
          pattern: '^[a-z_]+\.[a-z_]+$'
          description: '`{entity}.{verb}`, registered in audit-trail §4.'
          example: install_session.completed
        entityType:
          $ref: '#/components/schemas/AuditEntityType'
        entityId:
          type: string
          minLength: 1
          maxLength: 64
        before:
          type: [object, 'null']
          description: Sanitized state before mutation (`before_json`); null on create.
        after:
          type: [object, 'null']
          description: Sanitized state after mutation (`after_json`); null only if policy allows.
        createdAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/AuditSource'
        requestId:
          type: [string, 'null']
          maxLength: 128
          description: Correlates with HTTP `X-Request-Id` when present.
        installSessionId:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        metadata:
          type: [object, 'null']
          description: Event-specific extras (`metadata_json`); obeys audit-trail §5 sanitization.

    SuiteAuditEventList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SuiteAuditEvent'
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or null when no more rows.

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details. `type` uses `https://nene-suite.dev/problems/{slug}`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://nene-suite.dev/problems/install-session-not-found
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              description: Structured field errors for `validation-failed` and related slugs.
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field:
                    type: string
                    example: selectedApps
                  code:
                    type: string
                    example: dependency_unmet
                  detail:
                    type: string

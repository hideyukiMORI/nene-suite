                    displayName: Suite Admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
